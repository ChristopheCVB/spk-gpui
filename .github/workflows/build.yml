name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: spk-gpui-macos-arm64.zip
          - os: windows-2022
            artifact: spk-gpui.exe
          - os: ubuntu-24.04
            artifact: spk-gpui-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      SPK_URL: ${{ github.event_name == 'push' && vars.LIVEKIT_URL != '' && vars.SPK_URL || 'https://spk.example' }}
      LIVEKIT_URL: ${{ github.event_name == 'push' && vars.SPK_URL != '' && vars.LIVEKIT_URL || 'wss://voice.example' }}
      UPLOAD_BINARIES: ${{ github.event_name == 'push' && vars.SPK_URL != '' && vars.LIVEKIT_URL != '' }}
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Warn when download configuration is missing
        if: github.event_name == 'push' && env.UPLOAD_BINARIES != 'true'
        shell: bash
        run: echo "::warning::Set the SPK_URL and LIVEKIT_URL repository variables to enable build downloads."
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Select Xcode for ScreenCaptureKit
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcode_version="$(mise exec -- printenv SPK_XCODE_VERSION)"
          developer_dir="/Applications/Xcode_$xcode_version.app/Contents/Developer"
          test -d "$developer_dir"
          printf 'DEVELOPER_DIR=%s\n' "$developer_dir" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          clang_major="$(mise exec -- printenv SPK_CLANG_MAJOR)"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/apt.llvm.org.asc >/dev/null
          printf 'deb [signed-by=/usr/share/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-%s main\n' "$clang_major" | sudo tee /etc/apt/sources.list.d/spk-llvm.list
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libglib2.0-dev libjpeg-turbo8-dev libasound2-dev libpipewire-0.3-0t64 python3-gi xvfb "clang-$clang_major" "libclang-$clang_major-dev"
          printf 'CC=clang-%s\nCXX=clang++-%s\n' "$clang_major" "$clang_major" >> "$GITHUB_ENV"
      - run: mise exec -- cargo fmt --all --check
      - run: mise exec -- cargo test --locked
      - name: Test native X11 Screen Share
        if: runner.os == 'Linux'
        run: env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 xvfb-run -a -s "-screen 0 640x480x24" mise exec -- cargo test --locked --bin spk-gpui x11_sources_capture_and_end_when_the_window_disappears -- --ignored
      - name: Test Wayland ScreenCast portal cancellation
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- /usr/bin/python3 tests/fixtures/wayland-screen-portal.py \
            mise exec -- cargo test --locked --bin spk-gpui wayland_portal_cancellation_ends_source_selection -- --ignored
      - run: mise exec -- cargo build --locked
      - name: Verify Windows executable embeds DirectX shaders
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Launching on the runner can pass even when GPUI loads its shaders from the Cargo cache.
          $exe = (Resolve-Path target/debug/spk-gpui.exe).Path
          $image = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if (!$image.Contains('DXBC') -or $image.Contains('src/shaders.hlsl')) {
            throw 'The Windows executable must embed its DirectX shaders.'
          }
      - name: Verify macOS development bundle
        if: runner.os == 'macOS'
        run: |
          sh build/macos-bundle.sh
          codesign --verify --strict target/debug/SPK.app
      - name: Package macOS app
        if: env.UPLOAD_BINARIES == 'true' && runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent target/debug/SPK.app "target/debug/${{ matrix.artifact }}"
      - name: Package Linux executable
        if: env.UPLOAD_BINARIES == 'true' && runner.os == 'Linux'
        run: tar -czf "target/debug/${{ matrix.artifact }}" -C target/debug spk-gpui
      - name: Upload build
        if: env.UPLOAD_BINARIES == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/debug/${{ matrix.artifact }}
          archive: false
          if-no-files-found: error
          overwrite: true
