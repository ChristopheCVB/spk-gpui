name: Build

on:
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        description: Tag for the release being built
        type: string
        required: true
    outputs:
      asset-count:
        description: Number of packages produced by the build matrix
        value: ${{ jobs.build.outputs.asset-count }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: spk-gpui-macos-arm64.zip
          - os: windows-2022
            artifact: spk-gpui.exe
          - os: ubuntu-24.04
            artifact: spk-gpui-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    outputs:
      asset-count: ${{ strategy.job-total }}
    env:
      SPK_URL: ${{ github.event_name == 'push' && vars.LIVEKIT_URL != '' && vars.SPK_URL || 'https://spk.example' }}
      LIVEKIT_URL: ${{ github.event_name == 'push' && vars.SPK_URL != '' && vars.LIVEKIT_URL || 'wss://voice.example' }}
      UPLOAD_BINARIES: ${{ github.event_name == 'push' && vars.SPK_URL != '' && vars.LIVEKIT_URL != '' }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      BUILD_DIR: ${{ inputs.release-tag != '' && 'target/release' || 'target/debug' }}
    steps:
      - name: Require deployment URLs for a release
        if: inputs.release-tag != '' && env.UPLOAD_BINARIES != 'true'
        shell: bash
        run: |
          echo "::error::Set both SPK_URL and LIVEKIT_URL repository variables before retrying the release."
          exit 1
      - name: Warn when download configuration is missing
        if: github.event_name == 'push' && inputs.release-tag == '' && env.UPLOAD_BINARIES != 'true'
        shell: bash
        run: echo "::warning::Set the SPK_URL and LIVEKIT_URL repository variables to enable build downloads."
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || '' }}
      - name: Verify the release checkout
        if: inputs.release-tag != ''
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: jdx/mise-action@v5.3.0
      - name: Select Xcode for ScreenCaptureKit
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcode_version="$(mise exec -- printenv SPK_XCODE_VERSION)"
          developer_dir="/Applications/Xcode_$xcode_version.app/Contents/Developer"
          test -d "$developer_dir"
          printf 'DEVELOPER_DIR=%s\n' "$developer_dir" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          clang_major="$(mise exec -- printenv SPK_CLANG_MAJOR)"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/apt.llvm.org.asc >/dev/null
          printf 'deb [signed-by=/usr/share/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-%s main\n' "$clang_major" | sudo tee /etc/apt/sources.list.d/spk-llvm.list
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libglib2.0-dev libjpeg-turbo8-dev libasound2-dev libpipewire-0.3-dev pipewire pulseaudio pulseaudio-utils python3-gi xvfb "clang-$clang_major" "libclang-$clang_major-dev"
          printf 'CC=clang-%s\nCXX=clang++-%s\n' "$clang_major" "$clang_major" >> "$GITHUB_ENV"
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: mise exec -- {0}
          cache-bin: "false"
          env-vars: DEVELOPER_DIR
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.release-tag == '' }}
      - run: mise exec -- cargo fmt --all --check
      - run: mise exec -- cargo test --locked
      - name: Install the LiveKit peer fixture server
        if: runner.os == 'macOS'
        run: brew install livekit
      - name: Test LiveKit media with a controlled peer
        run: python tests/fixtures/livekit-peers.py mise exec -- cargo test --locked --bin spk-gpui livekit_ -- --ignored --test-threads=1
      - name: Test native Windows Screen Share when the runner supports it
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/fixtures/windows-screen-share.ps1 -IfAvailable
      - name: Test native macOS Screen Share with a controlled peer
        if: runner.os == 'macOS'
        shell: bash
        run: bash tests/fixtures/macos-screen-share.sh mise exec -- cargo test --locked --bin spk-gpui livekit_screen_share_publishes_video_and_separate_audio -- --ignored
      - name: Test native X11 Screen Share with a controlled peer
        if: runner.os == 'Linux'
        run: bash tests/fixtures/linux-screen-share.sh mise exec -- cargo test --locked --bin spk-gpui screen_share -- --ignored --test-threads=1
      - name: Test relaunch from a retained notification on Linux
        if: runner.os == 'Linux'
        run: |
          data_dir="$(mktemp -d)"
          XDG_DATA_HOME="$data_dir" SPK_TEST_NOTIFICATION_DATA="$data_dir" dbus-run-session -- \
            mise exec -- cargo test --locked --bin spk-gpui retained_notification_starts_the_registered_application -- --ignored
      - name: Test the PulseAudio voice reference
        if: runner.os == 'Linux'
        run: bash tests/fixtures/linux-screen-share.sh mise exec -- cargo test --locked --bin spk-gpui linux_voice_output -- --ignored
      - name: Test Wayland ScreenCast availability and picker rejection
        if: runner.os == 'Linux'
        run: |
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=wayland xvfb-run -a \
            mise exec -- cargo test --locked --bin spk-gpui wayland_without_socket_does_not_offer_x11_sources -- --ignored
          dbus-run-session -- /usr/bin/python3 tests/fixtures/wayland-screen-portal.py \
            mise exec -- cargo test --locked --bin spk-gpui wayland_portal_rejection_ends_source_selection -- --ignored
      - name: Test Wayland ScreenCast display and window sharing with a controlled peer
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash tests/fixtures/linux-screen-share.sh --wayland-display \
            mise exec -- cargo test --locked --bin spk-gpui livekit_screen_share_publishes_video_and_separate_audio -- --ignored
          dbus-run-session -- bash tests/fixtures/linux-screen-share.sh --wayland-window \
            mise exec -- cargo test --locked --bin spk-gpui wayland_window_publishes_video_only_and_preserves_voice -- --ignored
      - run: mise exec -- cargo build --locked ${{ inputs.release-tag != '' && '--release' || '' }}
      - name: Verify Windows executable embeds DirectX shaders
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Launching on the runner can pass even when GPUI loads its shaders from the Cargo cache.
          $exe = (Resolve-Path (Join-Path $env:BUILD_DIR 'spk-gpui.exe')).Path
          $image = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if (!$image.Contains('DXBC') -or $image.Contains('src/shaders.hlsl')) {
            throw 'The Windows executable must embed its DirectX shaders.'
          }
      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        run: |
          sh build/macos-bundle.sh "$BUILD_DIR"
          app="$BUILD_DIR/SPK.app"
          icon=$(plutil -extract CFBundleIconFile raw -expect string -o - "$app/Contents/Info.plist")
          test -f "$app/Contents/Resources/$icon"
          test -s "$app/Contents/Resources/$icon"
          codesign --verify --strict "$app"
      - name: Package macOS app
        if: env.UPLOAD_BINARIES == 'true' && runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "$BUILD_DIR/SPK.app" "$BUILD_DIR/${{ matrix.artifact }}"
      - name: Package Linux executable
        if: env.UPLOAD_BINARIES == 'true' && runner.os == 'Linux'
        run: tar -czf "$BUILD_DIR/${{ matrix.artifact }}" -C "$BUILD_DIR" spk-gpui -C ../../build media-licenses.txt
      - name: Upload build
        if: env.UPLOAD_BINARIES == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.BUILD_DIR }}/${{ matrix.artifact }}
          archive: false
          if-no-files-found: error
          overwrite: true
