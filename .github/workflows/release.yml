name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    concurrency:
      group: release-please
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        continue-on-error: true
      - name: Identify the draft to build
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_TAG" && ( "$RELEASE_OUTCOME" == failure || "$GITHUB_RUN_ATTEMPT" -gt 1 ) ]]; then
            # A draft can exist even if release-please fails before returning its tag.
            RELEASE_TAG=$(gh api graphql --paginate \
              -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" \
              -f query='query($owner: String!, $repo: String!, $endCursor: String) {
                repository(owner: $owner, name: $repo) {
                  releases(first: 100, after: $endCursor) {
                    nodes { isDraft tagName tagCommit { oid } }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }' | jq -r --arg sha "$GITHUB_SHA" '
                .data.repository.releases.nodes[]
                | select(.isDraft and .tagCommit.oid == $sha)
                | .tagName
              ')
          fi
          if [[ -z "$RELEASE_TAG" && "$RELEASE_OUTCOME" != success ]]; then
            echo "::error::release-please failed and no draft was found for this commit."
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            git check-ref-format "refs/tags/$RELEASE_TAG"
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: release-please
    if: needs.release-please.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ needs.release-please.outputs.tag }}

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: spk-gpui*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Publish the draft with all three assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        shell: bash
        run: |
          assets=(dist/spk-gpui-macos-arm64.zip dist/spk-gpui.exe dist/spk-gpui-linux-x64.tar.gz)
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          draft_id=$(gh release view "$TAG" --json databaseId,isDraft --jq 'select(.isDraft) | .databaseId')
          if [[ -n "$draft_id" ]]; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent
            gh api "repos/$GH_REPO/releases/$draft_id" --method PATCH -F draft=false -f make_latest=legacy --silent
          fi
