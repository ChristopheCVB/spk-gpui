[package]
name = "spk-gpui"
version = "0.5.1"
edition = "2024"
publish = false

[dependencies]
async-channel = "2.5"
arboard = { version = "3.7", default-features = false }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cookie_store = "0.22"
dfn3_rs = "=0.1.2"
dirs = "7"
flate2 = "1"
futures = "0.3"
global-hotkey = "=0.10.0"
html5ever = "0.27"
gpui-kit = "=0.10.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
image-webp = "0.2.4"
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.4", default-features = false, features = ["compiled_data"] }
keyring = "4.2"
livekit = { version = "=0.12.0", features = ["rustls-tls-native-roots"] }
markdown = "=1.0.0"
markup5ever_rcdom = "0.3"
mime_guess = "2"
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-native"] }
oxideav-aac = "=0.1.7"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json", "rustls-no-provider", "stream"] }
reqwest_cookie_store = "0.10"
rodio = { version = "=0.23.0", default-features = false, features = ["playback"] }
# Embed GPUI Kit icons in the debug binaries distributed by CI.
rust-embed = { version = "8.14", features = ["debug-embed"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rusty_h264-common = { version = "=0.17.3", default-features = false }
rusty_h264-decoder = { version = "=0.17.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "wav", "pcm", "ogg", "vorbis", "flac"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zvidlib-container = "=0.5.0"
zvidlib-core = "=0.5.0"
zvidlib-opus = "=0.5.0"
zvidlib-vp8 = { version = "=0.5.0", default-features = false }
zvidlib-vp9-decoder = { version = "=0.5.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
apple-cf = { version = "0.11.7", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSEvent"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["AudioHardware", "AudioHardwareDeprecated"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["CoreAudioBaseTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }
screencapturekit = { version = "=11.1.2", features = ["macos_15_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.1", default-features = false, features = ["async-io", "screencast"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
notify-rust = "=4.19.0"
cxx = "1.0"
pulseaudio = "0.3.2"
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
webrtc-sys = "=0.3.55"
x11rb = { version = "0.14", features = ["allow-unsafe-code", "xkb"] }
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy", "service"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
wasapi = "=0.27.0"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "UI_Notifications",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-registry = "0.100"
windows-capture = "=2.0.1"

[build-dependencies]
cc = "1.0"
embed-resource = "3.0"
pkg-config = "0.3"
url = "2.5"
webrtc-sys-build = "=0.3.21"

[profile.dev.package.gpui-pre-windows]
# Embed DirectX shaders so distributed builds can run without the Cargo source cache.
debug-assertions = false

# Keep DeepFilterNet within its 10 ms frame budget in the debug builds shipped by CI.
[profile.dev.package.dfn3_rs]
opt-level = 2

[profile.dev.package.realfft]
opt-level = 2

[profile.dev.package.rustfft]
opt-level = 2

[profile.dev.package.pulseaudio]
# Keep the protocol reactor responsive to teardown during continuous capture.
opt-level = 2
